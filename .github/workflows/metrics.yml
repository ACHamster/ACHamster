name: Generate Metrics

on:
  # 每天 UTC 0 点（北京时间早 8 点）自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点击触发运行
  workflow_dispatch:
  # 推送变更到主分支时触发
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: "" # 不生成基础信息卡片，仅生成语言分析
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 10
          plugin_languages_other: yes
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          repositories_affiliations: owner
